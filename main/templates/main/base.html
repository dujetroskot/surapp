<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Survey ML App{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f5f7fa;
        }

        .content-wrapper {
            flex: 1;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }

        footer {
            margin-top: auto;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-bar-chart-line"></i> Survey ML Analyser
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="bi bi-upload"></i> Kodiranje
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'statistics' %}">
                        <i class="bi bi-table"></i> Statistička analiza
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'ml' %}">
                        <i class="bi bi-robot"></i> ML analiza
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="content-wrapper">
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
</div>

<footer class="bg-light text-center py-3 mt-5 border-top">
    <small>Duje Troskot | dujetros@gmail.com</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
